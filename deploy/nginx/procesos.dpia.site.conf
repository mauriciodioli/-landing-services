# /etc/nginx/sites-available/procesos.dpia.site
# Proxy de la landing Inmersión IA aplicada a procesos.

server {
    listen 80;
    listen [::]:80;

    server_name procesos.dpia.site;

    access_log /var/log/nginx/procesos.dpia.site.access.log;
    error_log  /var/log/nginx/procesos.dpia.site.error.log;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
