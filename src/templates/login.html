<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso admin · DPIA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='participants/admin.css') }}">
  <style>body{font-family:Inter,system-ui,Arial,sans-serif;padding:40px;background:#f7f7f8} .login-box{max-width:420px;margin:40px auto;background:#fff;padding:24px;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.06)} label{display:block;margin-bottom:8px} input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #ddd;border-radius:4px}</style>
</head>
<body>
  <main class="login-box">
    <h2>Acceso administrativo</h2>
    <p>Inicia sesión con tu correo y contraseña de usuario.</p>
    <form id="loginForm">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required>
      <div style="display:flex;gap:8px;align-items:center">
        <button type="submit" class="button">Acceder</button>
        <a href="/" style="margin-left:8px;color:#666">Volver</a>
      </div>
      <div id="status" role="status" style="margin-top:12px;color:#b00"></div>
    </form>
  </main>
  <script src="{{ url_for('static', filename='participants/login.js') }}"></script>
</body>
</html>
