<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso admin · DPIA</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='participants/admin.css') }}">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{font-family:Inter,system-ui,Arial,sans-serif;padding:40px;background:#f7f7f8}
    .login-box{max-width:420px;margin:40px auto;background:#fff;padding:24px;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.06)}
    label{display:block;margin-bottom:8px}
    input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #ddd;border-radius:4px}
    /* Override header dark styles for login page */
    header.topbar{background:#fff;color:#172039;border-bottom:1px solid #e6e9f0}
    header.topbar .brand, header.topbar .desktop-nav a{color:inherit;text-decoration:none}
    header.topbar .brand img{height:28px;margin-right:.5rem}
    .desktop-nav a{margin-right:12px}
  </style>
</head>
<body>
  <header class="topbar">
    <button class="menu-trigger" id="menuTrigger" aria-expanded="false" aria-controls="sideMenu"><span>Menú</span><i></i><i></i><i></i></button>
    <a class="brand" href="/" aria-label="Inicio"><img class="brand-mark" src="/assets/dpia-symbol.png" alt="" aria-hidden="true"><span>DPIA</span><small>SOLUTIONS</small></a>
    <nav class="desktop-nav" aria-label="Navegación principal"><a href="/">Inicio</a><a href="/experiencia">Experiencia</a><a href="/login" class="login-link">Acceso admin</a></nav>
  </header>

  <main class="login-box">
    <h2>Acceso administrativo</h2>
    <p>Inicia sesión con tu correo y contraseña de usuario.</p>
    <form id="loginForm">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required>
      <div style="display:flex;gap:8px;align-items:center">
        <button type="submit" class="button">Acceder</button>
        <a href="/" style="margin-left:8px;color:#666">Volver</a>
      </div>
      <div id="status" role="status" style="margin-top:12px;color:#b00"></div>
    </form>
  </main>

  <script src="{{ url_for('static', filename='participants/login.js') }}"></script>
  <script src="/script.js"></script>
</body>
</html>
