# /etc/nginx/sites-available/call.dpia.site
# El DNS A de call.dpia.site debe apuntar al servidor Nginx.
# Flask escucha en 127.0.0.1:8300 y selecciona Talent Call por el Host.

server {
    listen 80;
    listen [::]:80;
    server_name call.dpia.site;

    access_log /var/log/nginx/call.dpia.site.access.log;
    error_log  /var/log/nginx/call.dpia.site.error.log;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
